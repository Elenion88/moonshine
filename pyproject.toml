[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonshine"
version = "0.1.0"
description = "Moonlight and Sunshine, tuned for your tailnet."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Austin" }]
keywords = ["remote-desktop", "sunshine", "moonlight", "tailscale", "streaming"]

# The CLI itself needs nothing but the standard library. Pillow is here for the
# artwork generators in scripts/ - it draws the mark the icons and box art are
# made from - and is not imported on any code path a user hits.
dependencies = []

[project.optional-dependencies]
art = ["pillow>=10.0"]
build = ["pyinstaller>=6.3"]

[project.scripts]
moonshine = "moonshine:main"

# No gui-script any more. The window and the tray are an Electron app now,
# built from app/ - see app/README.md.

[tool.setuptools]
# A flat layout of single modules rather than a package, which is what the
# scripts already import by name. Adding a package directory would mean
# rewriting every `import moonshine` in the CLI and the generators.
py-modules = ["moonshine", "brand", "chrome", "display", "glyph"]

# There is deliberately no package-data section. This is a flat layout of
# single modules rather than a package, and setuptools can only attach data
# files to a package - so a built wheel carries the code and not `assets/`.
#
# That is fine, because a wheel is not how this ships. The shipping artifacts
# are the PyInstaller builds, which bundle `assets/` and `configs/` explicitly
# (see packaging/). `pip install -e .` also works, because an editable install
# points back at the checkout where `assets/` is already sitting next to the
# code. A plain `pip install .` is the odd one out: it loses the Sunshine box
# art and the Moonlight window icon, both of which degrade quietly rather than
# failing. Fixing that properly means moving the modules into a package, which
# would mean rewriting every `import moonshine` in the tray, the window and the
# scripts - worth doing, but not as a side effect of adding packaging.
