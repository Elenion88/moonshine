# Sunshine host configuration - ayoung-MacBook-Air (Apple Silicon, macOS 26.5)
# Deployed to ~/.config/sunshine/sunshine.conf
#
# This is the reverse direction: controlling the Mac from Windows. The use case
# is desktop and dev work, not games, so the priorities are pointer accuracy and
# a correct keyboard - not frame rate.

# ---------------------------------------------------------------
# Encoder - VideoToolbox on Apple Silicon
# ---------------------------------------------------------------
encoder = videotoolbox

# ---------------------------------------------------------------
# Network
# ---------------------------------------------------------------
# Never punch a hole through the router. Access is over Tailscale only.
# Parsec was failing UPnP port mapping on this machine every five minutes;
# we don't want or need that path.
upnp = disabled

# Web UI reachable from LAN/Tailscale so the pairing PIN can be entered,
# but not from the WAN.
origin_web_ui_allowed = lan

# ---------------------------------------------------------------
# Note on the Command key
# ---------------------------------------------------------------
# Nothing is needed here for it to work. Sunshine's macOS input layer already
# maps Windows keycode 0x5B/0x5C to kVK_Command and injects
# kCGEventFlagMaskCommand. The gate is on the CLIENT: Moonlight swallows
# SDL_SCANCODE_LGUI unless system key capture is on, so the Windows client must
# pass --capture-system-keys always. See the `mac` profile in moonshine.py.
